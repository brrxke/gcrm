services:
  mongodb:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  auth-service:
    restart: always
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  users-service:
    restart: always
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  memberships-service:
    restart: always
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  bookings-service:
    restart: always
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  feedback-service:
    restart: always
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  analytics-service:
    restart: always
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  telegram-service:
    restart: always
    environment:
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  gateway:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  mongodb-backup:
    image: mongo:7.0
    container_name: gym-crm-mongodb-backup
    restart: unless-stopped
    entrypoint: |
      sh -c '
        while true; do
          DATE=$$(date +%Y%m%d_%H%M%S)
          mongodump --uri="$$MONGODB_URI" --out=/backups/backup_$$DATE
          echo "Backup completed: backup_$$DATE"
          find /backups -type d -mtime +7 -exec rm -rf {} +
          sleep 86400
        done
      '
    environment:
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - mongodb_backups:/backups
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

volumes:
  mongodb_backups:
