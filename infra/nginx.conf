events {}

http {
  upstream auth_service { server auth-service:5001; }
  upstream users_service { server users-service:5002; }
  upstream memberships_service { server memberships-service:5003; }
  upstream bookings_service { server bookings-service:5004; }
  upstream feedback_service { server feedback-service:5005; }
  upstream analytics_service { server analytics-service:5006; }
  upstream telegram_service { server telegram-service:5007; }
  upstream frontend_service { server frontend:80; }

  server {
    listen 5000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
      proxy_pass http://auth_service;
    }

    location /api/users/ {
      proxy_pass http://users_service;
    }

    location /api/memberships/ {
      proxy_pass http://memberships_service;
    }

    location /api/bookings/ {
      proxy_pass http://bookings_service;
    }

    location /api/feedback/ {
      proxy_pass http://feedback_service;
    }

    location /api/messages/ {
      proxy_pass http://feedback_service;
    }

    location /api/analytics/ {
      proxy_pass http://analytics_service;
    }

    location /api/telegram/ {
      proxy_pass http://telegram_service;
    }

    location /api/health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location / {
      proxy_pass http://frontend_service;
    }
  }
}
