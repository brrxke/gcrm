events {}

http {
  resolver 127.0.0.11 valid=10s;

  server {
    listen 5000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
      set $auth_upstream auth-service:5001;
      proxy_pass http://$auth_upstream;
    }

    location /api/users/ {
      set $users_upstream users-service:5002;
      proxy_pass http://$users_upstream;
    }

    location /api/memberships/ {
      set $memberships_upstream memberships-service:5003;
      proxy_pass http://$memberships_upstream;
    }

    location /api/bookings/ {
      set $bookings_upstream bookings-service:5004;
      proxy_pass http://$bookings_upstream;
    }

    location /api/feedback/ {
      set $feedback_upstream feedback-service:5005;
      proxy_pass http://$feedback_upstream;
    }

    location /api/messages/ {
      set $feedback_upstream feedback-service:5005;
      proxy_pass http://$feedback_upstream;
    }

    location /api/analytics/ {
      set $analytics_upstream analytics-service:5006;
      proxy_pass http://$analytics_upstream;
    }

    location /api/telegram/ {
      set $telegram_upstream telegram-service:5007;
      proxy_pass http://$telegram_upstream;
    }

    location /api/health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location / {
      set $frontend_upstream frontend:80;
      proxy_pass http://$frontend_upstream;
    }
  }
}
