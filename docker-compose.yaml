services:
  mongodb:
    image: mongo:7.0
    container_name: gym-crm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gym_crm
    networks:
      - gcrm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gym-crm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - gcrm-network

  mongo-express:
    image: mongo-express:latest
    container_name: gym-crm-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - gcrm-network

volumes:
  mongodb_data:
    driver: local

networks:
  gcrm-network:
    driver: bridge
    internal: false
