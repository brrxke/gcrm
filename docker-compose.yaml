services:
  mongodb:
    image: mongo:7.0
    container_name: gym-crm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - gcrm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${AUTH_PORT}
      - PYTHONPATH=/app
    command: ["python", "apps/services/auth/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  users-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-users
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${USERS_PORT}
      - PYTHONPATH=/app
    command: ["python", "apps/services/users/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  memberships-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-memberships
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${MEMBERSHIPS_PORT}
      - PYTHONPATH=/app
    command: ["python", "apps/services/memberships/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  bookings-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-bookings
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${BOOKINGS_PORT}
      - PYTHONPATH=/app
    command: ["python", "apps/services/bookings/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  feedback-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-feedback
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${FEEDBACK_PORT}
      - PYTHONPATH=/app
    command: ["python", "apps/services/feedback/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-analytics
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${ANALYTICS_PORT}
      - PYTHONPATH=/app
    command: ["python", "apps/services/analytics/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  telegram-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-telegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${TELEGRAM_PORT}
      - PYTHONPATH=/app
    command: ["python", "apps/services/telegram/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  gateway:
    image: nginx:1.25-alpine
    container_name: gym-crm-gateway
    restart: unless-stopped
    ports:
      - "5008:5000"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - users-service
      - memberships-service
      - bookings-service
      - feedback-service
      - analytics-service
      - telegram-service
    networks:
      - gcrm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gym-crm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - gateway
    networks:
      - gcrm-network

  mongo-express:
    image: mongo-express:latest
    container_name: gym-crm-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: ${MONGODB_URI}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH: ${ME_CONFIG_BASICAUTH}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - gcrm-network

volumes:
  mongodb_data:
    driver: local

networks:
  gcrm-network:
    driver: bridge
    internal: false
