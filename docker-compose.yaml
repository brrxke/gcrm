version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gym-crm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - gym-crm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: gym-crm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - JWT_SECRET_KEY=your_secret_key_here
      - FLASK_ENV=development
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gym-crm-network

  mongo-express:
    image: mongo-express:latest
    container_name: gym-crm-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - gym-crm-network

volumes:
  mongodb_data:
    driver: local

networks:
  gym-crm-network:
    driver: bridge