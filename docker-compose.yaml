      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${USERS_PORT}
      - PYTHONPATH=/app
      - FLASK_ENV=${FLASK_ENV:-development}
    command: >
      sh -c "gunicorn --bind 0.0.0.0:${USERS_PORT:-5002} --workers 2 --timeout 120 --access-logfile - --error-logfile - 'apps.services.users.app:create_app()'"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  memberships-service:
