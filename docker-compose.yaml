      - PORT=${MEMBERSHIPS_PORT}
      - PYTHONPATH=/app
      - FLASK_ENV=${FLASK_ENV:-development}
    command: >
      sh -c "gunicorn --bind 0.0.0.0:${MEMBERSHIPS_PORT:-5003} --workers 2 --timeout 120 --access-logfile - --error-logfile - 'apps.services.memberships.app:create_app()'"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  bookings-service:
