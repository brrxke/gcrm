    command: >
      sh -c "gunicorn --bind 0.0.0.0:${BOOKINGS_PORT:-5004} --workers 2 --timeout 120 --access-logfile - --error-logfile - 'apps.services.bookings.app:create_app()'"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  feedback-service:
