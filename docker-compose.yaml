services:
  mongodb:
    image: mongo:7.0
    container_name: gym-crm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gym_crm
    networks:
      - gcrm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
      - PORT=5001
      - PYTHONPATH=/app
    command: ["python", "services/auth/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  users-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-users
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
      - PORT=5002
      - PYTHONPATH=/app
    command: ["python", "services/users/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  memberships-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-memberships
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
      - PORT=5003
      - PYTHONPATH=/app
    command: ["python", "services/memberships/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  bookings-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-bookings
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
      - PORT=5004
      - PYTHONPATH=/app
    command: ["python", "services/bookings/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  feedback-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-feedback
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
      - PORT=5005
      - PYTHONPATH=/app
    command: ["python", "services/feedback/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-analytics
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
      - PORT=5006
      - PYTHONPATH=/app
    command: ["python", "services/analytics/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  telegram-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-telegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gym_crm
      - CORS_ORIGINS=http://localhost:8080
      - PORT=5007
      - PYTHONPATH=/app
    command: ["python", "services/telegram/app.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  gateway:
    image: nginx:1.25-alpine
    container_name: gym-crm-gateway
    restart: unless-stopped
    ports:
      - "5008:5000"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - users-service
      - memberships-service
      - bookings-service
      - feedback-service
      - analytics-service
      - telegram-service
    networks:
      - gcrm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gym-crm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://gateway:5000
    depends_on:
      - gateway
    networks:
      - gcrm-network

  mongo-express:
    image: mongo-express:latest
    container_name: gym-crm-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - gcrm-network

volumes:
  mongodb_data:
    driver: local

networks:
  gcrm-network:
    driver: bridge
    internal: false
