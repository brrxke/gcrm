services:
  mongodb:
    image: mongo:7.0
    container_name: gym-crm-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - gcrm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=${AUTH_PORT}
      - PYTHONPATH=/app
      - FLASK_ENV=${FLASK_ENV:-development}
    command: >
      sh -c "gunicorn --bind 0.0.0.0:${AUTH_PORT:-5001} --workers 2 --timeout 120 --access-logfile - --error-logfile - 'apps.services.auth.app:create_app()'"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gcrm-network

  users-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gym-crm-users
    restart: unless-stopped
