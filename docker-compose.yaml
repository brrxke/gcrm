  gateway:
    image: nginx:1.25-alpine
    container_name: gym-crm-gateway
    restart: unless-stopped
    ports:
      - "5008:5000"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - users-service
      - memberships-service
      - bookings-service
      - feedback-service
      - analytics-service
      - telegram-service
    networks:
      - gcrm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gym-crm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - gateway
    networks:
      - gcrm-network

volumes:
  mongodb_data:
    driver: local

networks:
  gcrm-network:
    driver: bridge
    internal: false
